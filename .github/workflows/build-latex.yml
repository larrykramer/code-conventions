name: Build, Tag, and Release LaTeX PDFs

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  build-tag-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The 'packages: read' permission can sometimes be needed for gh release download
      # depending on your organization's settings, but usually not for public repos.
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build and extract PDFs
        run: docker build --output . .

      - name: Check for PDF changes
        id: check-for-pdf-changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ls *.pdf 1>/dev/null 2>&1; then
            echo "No PDFs were generated. Skipping release."
            echo "changes-detected=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ -z "$(gh release list --limit 1)" ]]; then
            echo "No previous releases found. Creating the first release."
            echo "changes-detected=true" >> $GITHUB_OUTPUT
          else
            download_dir=$(mktemp -d)
            gh release download -D "$download_dir" -p '*.pdf' || true

            changes_detected="false"

            for new_file in *.pdf; do
              if ! cmp -s "$new_file" "${download_dir}/${new_file}" 2>/dev/null; then
                changes_detected="true"
                break
              fi
            done

            if [ "$changes_detected" = "false" ]; then
              for old_file in "${download_dir}"/*.pdf; do
                [ -f "$old_file" ] || continue
                if [ ! -f "$(basename "$old_file")" ]; then
                  changes_detected="true"
                  break
                fi
              done
            fi

            echo "changes-detected=$changes_detected" >> $GITHUB_OUTPUT
            if [ "$changes_detected" = "false" ]; then
              echo "No changes to PDF files. Skipping release."
            fi
          fi

      - name: Tag release
        id: tag-release
        if: steps.check-for-pdf-changes.outputs.changes-detected == 'true'
        run: |
          tag_name="release-$(date +'%Y-%m-%d-%H%M%S')"
          git tag "${tag_name}"
          git push origin "${tag_name}"
          echo "tag-name=${tag_name}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check-for-pdf-changes.outputs.changes-detected == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ steps.tag-release.outputs.tag-name }}"
          --title "Documents ${{ steps.tag-release.outputs.tag-name }}"
          --notes "Automated release with updated PDF documents. Triggered by commit: ${{ github.sha }}"
          *.pdf
